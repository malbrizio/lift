<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=390"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box;margin:0}body{width:390px;height:844px;background:#f4f4f5;font-family:Inter,sans-serif;color:#18181b;overflow:hidden}.top{padding:52px 20px 16px;display:flex;justify-content:space-between;align-items:center}.logo{font-weight:700;font-size:18px}.avatar{width:36px;height:36px;border-radius:50%;background:#7c3aed;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600}.hero{margin:0 20px;padding:20px;background:#fff;border-radius:20px;box-shadow:0 8px 30px rgba(124,58,237,.12)}.hero h1{font-size:22px;font-weight:700;margin-bottom:4px}.tag{display:inline-block;background:#ede9fe;color:#6d28d9;font-size:11px;font-weight:600;padding:4px 10px;border-radius:999px;margin-right:6px}.card{margin:16px 20px;padding:16px;background:#fff;border-radius:16px;border:1px solid #e4e4e7}.card h2{font-size:16px;font-weight:600;display:flex;align-items:center;gap:8px}.dot{width:8px;height:8px;border-radius:50%;background:#7c3aed}.set{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #f4f4f5;font-variant-numeric:tabular-nums;font-weight:600}.cta{margin:20px;background:#18181b;color:#fff;text-align:center;padding:16px;border-radius:16px;font-weight:600}.nav{position:absolute;bottom:0;left:0;right:0;display:flex;justify-content:space-around;padding:14px 8px 32px;background:#fff;border-top:1px solid #e4e4e7;font-size:11px;color:#71717a}.nav .on{color:#7c3aed;font-weight:600}</style></head><body>
