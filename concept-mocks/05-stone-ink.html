<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=390"><link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..600&display=swap" rel="stylesheet"><style>*{box-sizing:border-box;margin:0}body{width:390px;height:844px;background:#FAFAF9;color:#0A0A0A;font-family:Inter,sans-serif;padding:52px 20px 100px}.mark{font-size:15px;font-weight:600;letter-spacing:-0.04em;margin-bottom:28px}.mark em{font-style:normal;color:#A3A3A3;font-weight:500}.kicker{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:0.12em;color:#A3A3A3;margin-bottom:6px}.day{font-size:38px;font-weight:600;letter-spacing:-0.045em;line-height:1.05}.date{font-size:14px;color:#525252;margin:8px 0 24px}.inp{border:none;border-bottom:1px solid rgba(10,10,10,.08);background:transparent;font-size:17px;font-weight:500;padding:0 0 14px;width:100%;margin-bottom:20px;outline:none}.card{background:#fff;border:1px solid rgba(10,10,10,.08);border-radius:14px;padding:16px 18px;margin-bottom:12px}.card h3{font-size:15px;font-weight:600;margin-bottom:12px}.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.cell{background:#f5f5f4;border-radius:8px;padding:12px 6px;text-align:center;font-size:15px;font-weight:500;font-variant-numeric:tabular-nums}.btn{position:fixed;bottom:88px;left:20px;right:20px;background:#0A0A0A;color:#fff;text-align:center;padding:14px;border-radius:999px;font-weight:600;font-size:14px}.nav{position:fixed;bottom:12px;left:20px;right:20px;background:rgba(255,255,255,.85);backdrop-filter:blur(20px);border:1px solid rgba(10,10,10,.08);border-radius:999px;display:flex;justify-content:space-around;padding:10px 8px;font-size:11px;color:#A3A3A3}.nav .on{color:#0A0A0A;font-weight:600}</style></head><body>
<div class="mark">Iron <em>Log</em></div>
<div class="kicker">Today</div>
<div class="day">Tuesday</div>
<div class="date">October 13, 2026</div>
<input class="inp" value="Push Day" readonly>
<div class="card"><h3>Bench Press</h3><div class="grid"><div class="cell">8</div><div class="cell">185</div><div class="cell">—</div></div></div>
<div class="card"><h3>OHP</h3><div class="grid"><div class="cell">10</div><div class="cell">115</div><div class="cell">—</div></div></div>
<div class="btn">Save workout</div>
<div class="nav"><span class="on">Log</span><span>History</span><span>Stats</span><span>Import</span></div>
</body></html>
